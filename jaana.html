<title>Jaana &amp; Patryk — Speech</title>
<style>
  :root{
    --bg:#0b0b0d;
    --ink:#f4f1ec;
    --dim:#8a8790;
    --faint:#4a4852;
    --strava:#fc5200;
    --strava-soft:rgba(252,82,0,0.5);
    --line:rgba(255,255,255,0.08);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overscroll-behavior:none;user-select:none;-webkit-user-select:none;}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;}

  .topbar{display:flex;align-items:center;justify-content:space-between;
    padding:calc(12px + env(safe-area-inset-top,0px)) 18px 8px 18px;flex-shrink:0;z-index:20;}
  .brand{font-size:13px;letter-spacing:0.14em;text-transform:uppercase;color:var(--dim);font-weight:600;}
  .brand b{color:var(--strava);}
  .menu-btn{background:transparent;border:1px solid var(--faint);color:var(--dim);
    border-radius:50%;width:38px;height:38px;font-size:19px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;}
  .menu-btn:active{background:rgba(255,255,255,0.06);}

  .viewport{flex:1;position:relative;overflow:hidden;}
  .card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    text-align:center;padding:20px 30px;overflow-y:auto;
    transition:transform .28s ease,opacity .28s ease;}
  .card.enter-r{transform:translateX(100%);opacity:0;}
  .card.enter-l{transform:translateX(-100%);opacity:0;}
  .card.leave-l{transform:translateX(-100%);opacity:0;}
  .card.leave-r{transform:translateX(100%);opacity:0;}
  .card.active{transform:translateX(0);opacity:1;}

  .card-inner{margin:auto 0;display:flex;flex-direction:column;align-items:center;
    width:100%;max-width:40em;flex-shrink:0;}

  .slide-badge{display:inline-flex;align-items:center;gap:8px;
    background:var(--strava);color:#fff;font-weight:700;
    text-transform:uppercase;letter-spacing:0.08em;
    font-size:clamp(12px,2.6vw,15px);padding:8px 16px;border-radius:999px;
    margin-bottom:26px;box-shadow:0 8px 30px rgba(252,82,0,0.35);}
  .slide-badge .arrow{font-size:1.1em;}

  .say{font-size:clamp(24px,6vw,38px);line-height:1.45;font-weight:600;white-space:pre-line;}
  .card.punch .say{color:#fff;}
  .note{margin-top:26px;padding-top:12px;border-top:1px solid var(--line);
    color:var(--strava);font-size:clamp(14px,3vw,17px);font-style:italic;letter-spacing:0.02em;}

  .kicker{font-size:13px;letter-spacing:0.16em;text-transform:uppercase;color:var(--dim);
    margin-bottom:20px;}

  .botbar{display:flex;align-items:center;justify-content:center;gap:16px;
    padding:8px 0 calc(12px + env(safe-area-inset-bottom,0px)) 0;flex-shrink:0;z-index:20;}
  .dots{display:flex;gap:6px;align-items:center;}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--faint);transition:background .2s,transform .2s;}
  .dot.on{background:var(--strava);transform:scale(1.5);}
  .pos{font-size:12px;letter-spacing:0.1em;color:var(--dim);font-variant-numeric:tabular-nums;}

  .tap{position:absolute;top:0;bottom:0;width:26%;z-index:5;}
  .tap.l{left:0;} .tap.r{right:0;}

  .menu-overlay{position:fixed;inset:0;background:#060608;z-index:100;display:none;
    flex-direction:column;padding:calc(16px + env(safe-area-inset-top,0px)) 0 calc(16px + env(safe-area-inset-bottom,0px)) 0;}
  .menu-overlay.open{display:flex;}
  .menu-head{display:flex;justify-content:space-between;align-items:center;
    padding:0 20px 14px 20px;border-bottom:1px solid var(--line);flex-shrink:0;}
  .menu-title{font-size:13px;letter-spacing:0.12em;text-transform:uppercase;color:var(--dim);}
  .menu-close{background:transparent;border:none;color:var(--ink);font-size:26px;cursor:pointer;padding:4px 8px;line-height:1;}
  .menu-list{overflow-y:auto;flex:1;padding:6px 0;}
  .menu-item{display:flex;gap:12px;align-items:baseline;width:100%;background:transparent;border:none;
    border-bottom:1px solid rgba(255,255,255,0.05);color:var(--ink);text-align:left;
    padding:14px 20px;font-size:15px;cursor:pointer;line-height:1.35;}
  .menu-item:active{background:rgba(255,255,255,0.05);}
  .menu-item .n{color:var(--faint);font-size:12px;min-width:1.8em;font-variant-numeric:tabular-nums;}
  .menu-item.cur{color:var(--strava);}
  .menu-item .tag{color:var(--strava);font-size:11px;text-transform:uppercase;letter-spacing:0.06em;}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand"><b>Strava</b> · Jaana &amp; Patryk</div>
    <button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button>
  </div>
  <div class="viewport" id="viewport">
    <div class="tap l" id="tapL"></div>
    <div class="tap r" id="tapR"></div>
  </div>
  <div class="botbar">
    <span class="pos" id="pos"></span>
    <div class="dots" id="dots"></div>
  </div>
</div>

<div class="menu-overlay" id="menu">
  <div class="menu-head">
    <span class="menu-title">All cards</span>
    <button class="menu-close" id="menuClose" aria-label="Close">×</button>
  </div>
  <div class="menu-list" id="menuList"></div>
</div>

<script>
const CARDS = [
  { kicker:"The setup",
    text:"These guys aren't very big on social media,\nso we had to resort to their favourite platform — Strava.\n\nI thought we'd analyse their relationship through Strava." },

  { slide:"Jaana's first post, 2019",

  { text:"Jaana got two kudos.\nPatryk got one.\n\n..... From Jaana.", punch:true, note:"pause for laugh" },

  { text:"My interpretation from this:\nJaana forced running — or at least Strava — onto Patryk." },

  { text:"I expected to see some romantic trends after their first run.\n\nBut it was pretty underwhelming." },

  { slide:"May 2021 activities",
    text:"Following activities that month:\none walk, one round of disc golf, and one more run with Jaana.\n\nThat was it." },

  { slide:"Jaana's marathon",
    text:"Meanwhile — Jaana ran her fastest marathon.\n\nSpontaneously. Unplanned.", note:"pause" },

  { text:"Now, we're not going to compare these two." },

  { slide:"Two activities, side by side",
    text:"But here are two random activities:\n\nJaana — 120 km, in 19 hours.\nPatryk — 0.5 km, in 1.5 minutes.", punch:true, note:"pause for laugh" },

  { text:"But it's paid off — he's a minute per kilometre faster today than when they started running together." },

  { text:"Then I suddenly realised…\nthis might not be about running anymore." },

  { kicker:"Hand off",
    text:"So — eeeeeh — over to Robin.", note:"you're done — hand over" },
];

const vp = document.getElementById('viewport');
const posEl = document.getElementById('pos');
const dotsEl = document.getElementById('dots');
const KEY = 'jaana_speech_card';

let cur = load();
let curEl = null;

function load(){ try{ const n=parseInt(localStorage.getItem(KEY),10); if(!isNaN(n)&&n>=0&&n<CARDS.length) return n; }catch(e){} return 0; }
function save(){ try{ localStorage.setItem(KEY,String(cur)); }catch(e){} }

function build(c){
  const el=document.createElement('div');
  el.className='card'+(c.punch?' punch':'');
  const inner=document.createElement('div'); inner.className='card-inner'; el.appendChild(inner);
  if(c.kicker){ const k=document.createElement('div'); k.className='kicker'; k.textContent=c.kicker; inner.appendChild(k); }
  if(c.slide){ const b=document.createElement('div'); b.className='slide-badge';
    b.innerHTML='<span class="arrow">▸</span> SLIDE: '+escapeHtml(c.slide); inner.appendChild(b); }
  const s=document.createElement('div'); s.className='say'; s.textContent=c.text; inner.appendChild(s);
  if(c.note){ const nn=document.createElement('div'); nn.className='note'; nn.textContent='— '+c.note; inner.appendChild(nn); }
  return el;
}
function escapeHtml(s){ return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

function render(dir){
  const el=build(CARDS[cur]);
  if(curEl){
    if(dir===1){ el.classList.add('enter-r'); vp.appendChild(el);
      requestAnimationFrame(()=>{ curEl.classList.add('leave-l'); curEl.classList.remove('active'); el.classList.remove('enter-r'); el.classList.add('active'); }); }
    else if(dir===-1){ el.classList.add('enter-l'); vp.appendChild(el);
      requestAnimationFrame(()=>{ curEl.classList.add('leave-r'); curEl.classList.remove('active'); el.classList.remove('enter-l'); el.classList.add('active'); }); }
    else { el.classList.add('active'); vp.appendChild(el); }
    const old=curEl; setTimeout(()=>{ if(old&&old.parentNode) old.parentNode.removeChild(old); },320);
  } else { el.classList.add('active'); vp.appendChild(el); }
  curEl=el;
  posEl.textContent=(cur+1)+' / '+CARDS.length;
  [...dotsEl.children].forEach((d,i)=>d.classList.toggle('on',i===cur));
  save();
}
function go(i,dir){ if(i<0||i>=CARDS.length||i===cur) return; cur=i; render(dir); }
function next(){ go(cur+1,1); }
function prev(){ go(cur-1,-1); }

// dots
CARDS.forEach(()=>{ const d=document.createElement('div'); d.className='dot'; dotsEl.appendChild(d); });

// keyboard
document.addEventListener('keydown',e=>{
  if(document.getElementById('menu').classList.contains('open')){ if(e.key==='Escape') closeMenu(); return; }
  if(e.key==='ArrowRight'||e.key===' '){ e.preventDefault(); next(); }
  if(e.key==='ArrowLeft') prev();
});
// swipe
let sx=0,sy=0,tp=false;
vp.addEventListener('touchstart',e=>{ if(e.touches.length!==1)return; tp=true; sx=e.touches[0].clientX; sy=e.touches[0].clientY; },{passive:true});
vp.addEventListener('touchend',e=>{ if(!tp)return; tp=false;
  const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)){ if(dx<0) next(); else prev(); } },{passive:true});
document.getElementById('tapL').addEventListener('click',prev);
document.getElementById('tapR').addEventListener('click',next);

// menu
const menu=document.getElementById('menu'), menuList=document.getElementById('menuList');
function buildMenu(){ menuList.innerHTML=''; CARDS.forEach((c,i)=>{
  const it=document.createElement('button'); it.className='menu-item'+(i===cur?' cur':'');
  const label=c.slide? c.slide : (c.kicker? c.kicker : c.text.split('\n')[0]);
  it.innerHTML='<span class="n">'+(i+1)+'</span><span>'+escapeHtml(label)+(c.slide?' <span class="tag">slide</span>':'')+'</span>';
  it.addEventListener('click',()=>{ const dir=i>cur?1:(i<cur?-1:0); cur=i; render(dir); closeMenu(); });
  menuList.appendChild(it);
}); }
function openMenu(){ buildMenu(); menu.classList.add('open'); const c=menuList.querySelector('.cur'); if(c) c.scrollIntoView({block:'center'}); }
function closeMenu(){ menu.classList.remove('open'); }
document.getElementById('menuBtn').addEventListener('click',openMenu);
document.getElementById('menuClose').addEventListener('click',closeMenu);
menu.addEventListener('click',e=>{ if(e.target===menu) closeMenu(); });

// wake lock
let wl=null;
async function wake(){ try{ if('wakeLock' in navigator) wl=await navigator.wakeLock.request('screen'); }catch(e){} }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') wake(); });
wake();

render(0);
</script>
</body>
</html>
