<title>Peter &amp; Ellie — Best Man Speech</title>
<style>
  :root{
    --bg:#0d0b0f;
    --ink:#f4efe6;
    --dim:#928c82;
    --faint:#4c4640;
    --accent:#d4b06a;
    --accent-soft:rgba(212,176,106,0.5);
    --line:rgba(255,255,255,0.08);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overscroll-behavior:none;user-select:none;-webkit-user-select:none;}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;}

  .topbar{display:flex;align-items:center;justify-content:space-between;
    padding:calc(12px + env(safe-area-inset-top,0px)) 18px 8px 18px;flex-shrink:0;z-index:20;}
  .brand{font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:var(--dim);font-weight:600;}
  .brand b{color:var(--accent);}
  .menu-btn{background:transparent;border:1px solid var(--faint);color:var(--dim);
    border-radius:50%;width:38px;height:38px;font-size:19px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;}
  .menu-btn:active{background:rgba(255,255,255,0.06);}

  .viewport{flex:1;position:relative;overflow:hidden;}
  .card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    text-align:center;padding:20px 30px;overflow-y:auto;
    transition:transform .28s ease,opacity .28s ease;}
  .card.enter-r{transform:translateX(100%);opacity:0;}
  .card.enter-l{transform:translateX(-100%);opacity:0;}
  .card.leave-l{transform:translateX(-100%);opacity:0;}
  .card.leave-r{transform:translateX(100%);opacity:0;}
  .card.active{transform:translateX(0);opacity:1;}

  .card-inner{margin:auto 0;display:flex;flex-direction:column;align-items:center;
    width:100%;max-width:40em;flex-shrink:0;}

  .kicker{font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:var(--accent);
    margin-bottom:22px;}

  .say{font-size:clamp(21px,4.6vw,32px);line-height:1.5;font-weight:500;white-space:pre-line;}
  .card.punch .say{font-weight:700;color:#fff;font-size:clamp(24px,6vw,40px);}
  .note{margin-top:24px;padding-top:12px;border-top:1px solid var(--line);
    color:var(--accent);font-size:clamp(13px,2.6vw,16px);font-style:italic;letter-spacing:0.02em;}

  .botbar{display:flex;align-items:center;justify-content:center;gap:14px;
    padding:8px 0 calc(12px + env(safe-area-inset-bottom,0px)) 0;flex-shrink:0;z-index:20;}
  .dots{display:flex;gap:4px;align-items:center;max-width:70vw;overflow:hidden;justify-content:center;flex-wrap:wrap;}
  .dot{width:5px;height:5px;border-radius:50%;background:var(--faint);transition:background .2s,transform .2s;}
  .dot.on{background:var(--accent);transform:scale(1.5);}
  .pos{font-size:12px;letter-spacing:0.1em;color:var(--dim);font-variant-numeric:tabular-nums;flex-shrink:0;}

  .tap{position:absolute;top:0;bottom:0;width:26%;z-index:5;}
  .tap.l{left:0;} .tap.r{right:0;}

  .menu-overlay{position:fixed;inset:0;background:#080609;z-index:100;display:none;
    flex-direction:column;padding:calc(16px + env(safe-area-inset-top,0px)) 0 calc(16px + env(safe-area-inset-bottom,0px)) 0;}
  .menu-overlay.open{display:flex;}
  .menu-head{display:flex;justify-content:space-between;align-items:center;
    padding:0 20px 14px 20px;border-bottom:1px solid var(--line);flex-shrink:0;}
  .menu-title{font-size:13px;letter-spacing:0.12em;text-transform:uppercase;color:var(--dim);}
  .menu-close{background:transparent;border:none;color:var(--ink);font-size:26px;cursor:pointer;padding:4px 8px;line-height:1;}
  .menu-list{overflow-y:auto;flex:1;padding:6px 0;}
  .menu-item{display:flex;gap:12px;align-items:baseline;width:100%;background:transparent;border:none;
    border-bottom:1px solid rgba(255,255,255,0.05);color:var(--ink);text-align:left;
    padding:13px 20px;font-size:14px;cursor:pointer;line-height:1.35;}
  .menu-item:active{background:rgba(255,255,255,0.05);}
  .menu-item .n{color:var(--faint);font-size:12px;min-width:1.9em;font-variant-numeric:tabular-nums;}
  .menu-item.cur{color:var(--accent);}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand"><b>House Nyrén</b> · Peter &amp; Ellie</div>
    <button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button>
  </div>
  <div class="viewport" id="viewport">
    <div class="tap l" id="tapL"></div>
    <div class="tap r" id="tapR"></div>
  </div>
  <div class="botbar">
    <span class="pos" id="pos"></span>
    <div class="dots" id="dots"></div>
  </div>
</div>

<div class="menu-overlay" id="menu">
  <div class="menu-head">
    <span class="menu-title">All cards</span>
    <button class="menu-close" id="menuClose" aria-label="Close">×</button>
  </div>
  <div class="menu-list" id="menuList"></div>
</div>

<script>
const CARDS = [
  { text:"My lords, my ladies." },
  { kicker:"Who am I", text:"I am Paul, the eldest son of House Nyrén. First of my Name. Protector of the Sea. Fixer of All Things IT.", note:"pause" },
  { text:"And Best Man.", punch:true, note:"pause" },

  { text:"This speech really wrote itself, but I ended up with hours of content. Consider this a teaser for the upcoming documentary called My Brother — The Man Who Would Never Be Bothered. I've tried to distill his essence into a few short anecdotes." },
  { text:"Peter is the most comfortable man I have ever met. I don't mean relaxed — I mean comfortable, as a way of life." },
  { text:"Ask Peter for a favour and there is a 76% chance he will take a bath instead. Not before the favour — instead of it." },
  { text:"He is never really sorry for it either. He doesn't let you down with guilt. He lets you down with complete serenity.", note:"pause" },

  { kicker:"The knife", text:"One summer when we were kids, Peter borrowed my Swiss army knife to do something outdoorsy. He misplaced it. That Christmas, my gift from him was a note saying that I would be receiving a new pocket knife as compensation.", note:"pause" },
  { text:"I want to stress that the note was the present.", note:"pause" },
  { text:"I have never received the knife.", punch:true, note:"pause" },

  { kicker:"The bicycles", text:"I have never had a bike stolen in my life. Peter has had ten bicycles stolen." },
  { text:"One of the ten was our mother's. It went missing mysteriously, and it stayed missing for well over a year." },
  { text:"Then one day I walked past the underground station, about five hundred metres from our flat, and I saw a bicycle that looked remarkably similar — neatly locked up and ready to go. And we only ever had one key to that bike. So I walked home, got the key, walked back.", note:"pause" },
  { text:"Would you believe it. It fit.", punch:true, note:"pause" },
  { text:"So at some point, my brother had cycled five hundred metres, given up, locked the bike, taken the underground instead. Come home, put the key back in the drawer, forgotten about the whole endeavour, and then assumed it had been stolen. I don't know anything about the fate of the other nine bikes, but I do find theft hard to believe.", note:"pause" },

  { kicker:"The guitar", text:"Peter once found a guitar in his own wardrobe. Not his guitar — he doesn't play. A guitar, in his home, that he could not account for. A wild guitar suddenly appeared in his not very deep wardrobe." },
  { text:"If anyone here has had a guitar go missing — let me know.", note:"pause" },

  { kicker:"The flat", text:"And then there's the flat." },
  { text:"When Peter was a student in Uppsala, a city notoriously difficult to get apartments in, the lease on his shared house ran out. Everyone he lived with sorted themselves out months in advance, like adults. Peter did nothing. Absolutely nothing." },
  { text:"The day before he was due to be evicted, he bumped into Björn at our squash court, who asked him: \"Don't you study in Uppsala? Do you want an apartment?\"", note:"pause" },
  { text:"He didn't lift a finger. The universe served him an apartment on a plate.", note:"pause" },

  { text:"And this is the thing about my brother that I want you all to understand. Peter loses things — and the universe brings them back. Every time. Bicycles. Guitars he never owned. Somewhere to live.", note:"pause" },
  { text:"Not that he kept any of it. The bike went missing again. The flat is long gone. The guitar, I assume, is still in the closet.", note:"pause" },

  { text:"Now — I know a lot of you wonder how someone gets through life like this. How you become a doctor. How you get married. When you're this fundamentally unbothered.", note:"pause" },
  { text:"I'll let you in on the secret. The universe picks up his slack. And when the universe is busy, the rest of us do. His support network.", note:"pause" },
  { text:"Why do we do it? Because behind all of it, he is the warmest, funniest, loveliest man you'll meet. Sensitive, caring. Easy to talk to and always in a good mood. Genuinely a joy to be around.", note:"pause" },
  { text:"And he's clever. He's learned to make the rest of us want to pick up his slack. Cognitive offloading, with a smile. My brother is a man of shortcuts.", note:"pause" },

  { kicker:"Ellie", text:"Which brings me to Ellie." },
  { text:"They met in a corridor in Uppsala. Dated for a while. And then, in the great tradition of my brother's relationship with things around him —", note:"pause" },
  { text:"— he lost her too. For years.", punch:true, note:"pause" },
  { text:"Years went by, and then the universe gave us Covid. Covid gave Peter a fever. And in a delirious state, that Peter doesn't even remember today, he found some courage and texted Ellie.", note:"pause" },
  { text:"Thank you, Covid. Thank you, universe.", note:"pause" },
  { text:"Ellie says yes to anything. She is dependable. Fiercely loyal. Where Peter underpromises and underdelivers, Ellie overpromises and overdelivers. She is highly organised, and she knows where she parked her bike.", note:"pause" },

  { kicker:"The handover", text:"Ellie — I hand him over to you now." },
  { text:"You're the one who picks up the slack now. Your happy moments are his to share. His burdens are now yours.", note:"pause" },
  { text:"Oh — and you owe me a pocket knife.", punch:true, note:"let the laugh land" },

  { kicker:"The toast", text:"Ladies and gentlemen, please be upstanding.\n\nTo Peter and Ellie.", note:"raise your glass" },
];

const vp=document.getElementById('viewport');
const posEl=document.getElementById('pos');
const dotsEl=document.getElementById('dots');
const KEY='peter_speech_card';
let cur=load(), curEl=null;
function load(){ try{ const n=parseInt(localStorage.getItem(KEY),10); if(!isNaN(n)&&n>=0&&n<CARDS.length) return n; }catch(e){} return 0; }
function save(){ try{ localStorage.setItem(KEY,String(cur)); }catch(e){} }
function escapeHtml(s){ return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
function build(c){
  const el=document.createElement('div'); el.className='card'+(c.punch?' punch':'');
  const inner=document.createElement('div'); inner.className='card-inner'; el.appendChild(inner);
  if(c.kicker){ const k=document.createElement('div'); k.className='kicker'; k.textContent=c.kicker; inner.appendChild(k); }
  const s=document.createElement('div'); s.className='say'; s.textContent=c.text; inner.appendChild(s);
  if(c.note){ const nn=document.createElement('div'); nn.className='note'; nn.textContent='— '+c.note; inner.appendChild(nn); }
  return el;
}
function render(dir){
  const el=build(CARDS[cur]);
  if(curEl){
    if(dir===1){ el.classList.add('enter-r'); vp.appendChild(el);
      requestAnimationFrame(()=>{ curEl.classList.add('leave-l'); curEl.classList.remove('active'); el.classList.remove('enter-r'); el.classList.add('active'); }); }
    else if(dir===-1){ el.classList.add('enter-l'); vp.appendChild(el);
      requestAnimationFrame(()=>{ curEl.classList.add('leave-r'); curEl.classList.remove('active'); el.classList.remove('enter-l'); el.classList.add('active'); }); }
    else { el.classList.add('active'); vp.appendChild(el); }
    const old=curEl; setTimeout(()=>{ if(old&&old.parentNode) old.parentNode.removeChild(old); },320);
  } else { el.classList.add('active'); vp.appendChild(el); }
  curEl=el;
  posEl.textContent=(cur+1)+' / '+CARDS.length;
  [...dotsEl.children].forEach((d,i)=>d.classList.toggle('on',i===cur));
  save();
}
function go(i,dir){ if(i<0||i>=CARDS.length||i===cur) return; cur=i; render(dir); }
function next(){ go(cur+1,1); } function prev(){ go(cur-1,-1); }
CARDS.forEach(()=>{ const d=document.createElement('div'); d.className='dot'; dotsEl.appendChild(d); });
document.addEventListener('keydown',e=>{
  if(document.getElementById('menu').classList.contains('open')){ if(e.key==='Escape') closeMenu(); return; }
  if(e.key==='ArrowRight'||e.key===' '){ e.preventDefault(); next(); }
  if(e.key==='ArrowLeft') prev();
});
let sx=0,sy=0,tp=false;
vp.addEventListener('touchstart',e=>{ if(e.touches.length!==1)return; tp=true; sx=e.touches[0].clientX; sy=e.touches[0].clientY; },{passive:true});
vp.addEventListener('touchend',e=>{ if(!tp)return; tp=false;
  const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)){ if(dx<0) next(); else prev(); } },{passive:true});
document.getElementById('tapL').addEventListener('click',prev);
document.getElementById('tapR').addEventListener('click',next);
const menu=document.getElementById('menu'), menuList=document.getElementById('menuList');
function buildMenu(){ menuList.innerHTML=''; CARDS.forEach((c,i)=>{
  const it=document.createElement('button'); it.className='menu-item'+(i===cur?' cur':'');
  const label=c.kicker? c.kicker : c.text.split('\n')[0];
  it.innerHTML='<span class="n">'+(i+1)+'</span><span>'+escapeHtml(label)+'</span>';
  it.addEventListener('click',()=>{ const dir=i>cur?1:(i<cur?-1:0); cur=i; render(dir); closeMenu(); });
  menuList.appendChild(it);
}); }
function openMenu(){ buildMenu(); menu.classList.add('open'); const c=menuList.querySelector('.cur'); if(c) c.scrollIntoView({block:'center'}); }
function closeMenu(){ menu.classList.remove('open'); }
document.getElementById('menuBtn').addEventListener('click',openMenu);
document.getElementById('menuClose').addEventListener('click',closeMenu);
menu.addEventListener('click',e=>{ if(e.target===menu) closeMenu(); });
let wl=null;
async function wake(){ try{ if('wakeLock' in navigator) wl=await navigator.wakeLock.request('screen'); }catch(e){} }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') wake(); });
wake();
if('serviceWorker' in navigator){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('peter-sw.js').catch(()=>{}); }); }
render(0);
</script>
</body>
